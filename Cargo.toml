[package]
name="gemma-agent"
version="1.0.0"
edition="2024"
authors=["icy-person"]
description="A clean-room educational language model implemented in Rust"
license="MIT"

[features]
default=["runner-cpu"]
# GitHub-hosted runner / portable scalar CPU backend.
runner-cpu=[]
# Desktop Linux AMD/Intel Vulkan backend through Burn + WGPU.
amd-vulkan=["dep:burn","dep:burn-wgpu","burn/std","burn/autodiff","burn/wgpu","burn/fusion"]
# Android arm64 Vulkan backend through the same Burn + WGPU engine.
android-vulkan=["dep:burn","dep:burn-wgpu","burn/std","burn/autodiff","burn/wgpu","burn/fusion"]
# The default is intentionally CPU for local/runner compatibility. Use
# --no-default-features when selecting the GPU backend explicitly.

[dependencies]
burn={version="0.21.0",default-features=false,optional=true}
burn-wgpu={version="0.21.0",default-features=false,optional=true}

[profile.release]
opt-level=3
lto=true
codegen-units=1
