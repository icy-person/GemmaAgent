[package]
name="gemma-agent"
version="1.0.0"
edition="2024"
authors=["icy-person"]
description="A clean-room educational language model implemented in Rust"
license="MIT"

[features]
default=["runner-cpu"]
# Portable scalar Rust backend used by GitHub Actions/CPU runners.
runner-cpu=[]
# Optional NVIDIA/CUDA path for supported desktop systems.
cuda=["dep:candle-core","dep:candle-nn","candle-core/cuda","candle-nn/cuda"]
# Desktop Linux AMD/Intel Vulkan path through Burn + WGPU.
amd-vulkan=["dep:burn","dep:burn-wgpu","burn/std","burn/autodiff","burn/wgpu","burn/fusion"]
# Android GPU path through the same Burn/WGPU Vulkan engine, built for arm64-v8a.
android-vulkan=["dep:burn","dep:burn-wgpu","burn/std","burn/autodiff","burn/wgpu","burn/fusion"]

[dependencies]
candle-core={version="0.11.0",default-features=false,optional=true}
candle-nn={version="0.11.0",default-features=false,optional=true}
burn={version="0.21.0",default-features=false,optional=true}
burn-wgpu={version="0.21.0",default-features=false,optional=true}

[profile.release]
opt-level=3
lto=true
codegen-units=1
