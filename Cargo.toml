[package]
name="gemma-agent"
version="1.0.0"
edition="2024"
authors=["icy-person"]
description="A clean-room educational language model implemented in Rust"
license="MIT"
autobins=false

[features]
default=["runner-cpu"]
runner-cpu=[]
amd-vulkan=["dep:burn","dep:burn-wgpu","burn/std","burn/autodiff","burn/wgpu","burn/fusion"]
android-vulkan=["dep:burn","dep:burn-wgpu","burn/std","burn/autodiff","burn/wgpu","burn/fusion"]

[dependencies]
burn={version="0.21.0",default-features=false,optional=true}
burn-wgpu={version="0.21.0",default-features=false,optional=true}
eframe={version="0.36.2",default-features=true}

[[bin]]
name="gemma-ui"
path="src/bin/gemma-ui.rs"

[[bin]]
name="cpu-train"
path="backend/cpu/bin/cpu-train.rs"
required-features=["runner-cpu"]

[[bin]]
name="amd-train"
path="backend/amd/bin/amd-train.rs"
required-features=["amd-vulkan"]

[[bin]]
name="amd-bench"
path="backend/amd/bin/amd-bench.rs"
required-features=["amd-vulkan"]

[[bin]]
name="amd-infer"
path="backend/amd/bin/amd-infer.rs"
required-features=["amd-vulkan"]

[[bin]]
name="android-infer"
path="backend/android/bin/android-infer.rs"
required-features=["android-vulkan"]

[profile.release]
opt-level=3
lto=true
codegen-units=1
