name: Build GemmaAgent Linux (Arch/CachyOS)

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

jobs:
  linux-arch:
    name: Arch Linux x86_64 distribution
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            jdk21-openjdk \
            git \
            unzip \
            zip \
            which \
            curl \
            wget \
            fakeroot
          java -version

      - name: Build Linux desktop distribution
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          gradle :desktop:clean :desktop:packageDistributionForCurrentOS --no-daemon

      - name: Show distribution files
        run: |
          find desktop/build/compose/binaries -maxdepth 8 -type f -print
          test -n "$(find desktop/build/compose/binaries -type f -print -quit)"

      - name: Create Arch-friendly bundle
        run: |
          mkdir -p dist/GemmaAgent
          cp -a desktop/build/compose/binaries/. dist/GemmaAgent/
          cp README.md dist/GemmaAgent/ 2>/dev/null || true
          tar -C dist -czf GemmaAgent-Arch-x86_64.tar.gz GemmaAgent

      - name: Upload Arch/CachyOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-Arch-x86_64
          path: GemmaAgent-Arch-x86_64.tar.gz
          if-no-files-found: error
