name: Build GemmaAgent Linux (Arch/CachyOS)

on:
  workflow_dispatch:

jobs:
  linux-arch:
    name: Arch Linux x86_64 distribution
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            jdk21-openjdk \
            git \
            unzip \
            zip \
            which \
            curl \
            wget
          java -version

      - name: Install official Gradle 9.7.1
        run: |
          mkdir -p /opt/gradle
          curl -fsSL https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          ln -sfn /opt/gradle/gradle-9.7.1 /opt/gradle/current
          /opt/gradle/current/bin/gradle --version

      - name: Build portable Linux distribution
        run: |
          /opt/gradle/current/bin/gradle :desktop:clean :desktop:createDistributable --no-daemon
          test -d desktop/build/compose/binaries/main/app/GemmaAgent
          mkdir -p dist
          tar -C desktop/build/compose/binaries/main/app \
            -czf dist/GemmaAgent-Arch-x86_64.tar.gz GemmaAgent

      - name: Verify distribution
        run: |
          test -s dist/GemmaAgent-Arch-x86_64.tar.gz
          tar -tzf dist/GemmaAgent-Arch-x86_64.tar.gz | head -50

      - name: Upload Arch/CachyOS distribution
        uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-Arch-x86_64
          path: dist/GemmaAgent-Arch-x86_64.tar.gz
          if-no-files-found: error
