name: Build GemmaAgent

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install NDK and Rust targets
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk
      - name: Build Rust Android library
        working-directory: rust-core
        run: |
          chmod +x build_android.sh
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.13113456" ./build_android.sh
      - name: Package Rust libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          cp rust-core/target/aarch64-linux-android/release/libgemma_agent_core.so app/src/main/jniLibs/arm64-v8a/
          cp rust-core/target/x86_64-linux-android/release/libgemma_agent_core.so app/src/main/jniLibs/x86_64/
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build desktop distribution
        run: ./gradlew :desktop:packageDistributionForCurrentOS --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-desktop
          path: desktop/build/compose/binaries/**
