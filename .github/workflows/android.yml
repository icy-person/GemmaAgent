name: Build GemmaAgent

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type
        required: true
        default: debug
        type: choice
        options: [debug, release]
      build_desktop:
        description: Build desktop distribution
        required: true
        default: true
        type: boolean

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install NDK and Rust targets
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk
      - name: Build Rust Android library
        run: |
          chmod +x rust-core/build_android.sh
          ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/29.0.13113456" ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/29.0.13113456" ./rust-core/build_android.sh
      - name: Verify native libraries
        run: |
          test -f app/src/main/jniLibs/arm64-v8a/libgemma_agent_core.so
          test -f app/src/main/jniLibs/x86_64/libgemma_agent_core.so
      - name: Build APK
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            gradle :app:assembleRelease --no-daemon
            APK_DIR="app/build/outputs/apk/release"
          else
            gradle :app:assembleDebug --no-daemon
            APK_DIR="app/build/outputs/apk/debug"
          fi
          test -d "$APK_DIR"
          find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print
          test -n "$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-${{ inputs.build_type }}-apk
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error

  desktop:
    if: ${{ inputs.build_desktop }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop distribution
        run: |
          gradle :desktop:clean :desktop:packageDistributionForCurrentOS --no-daemon
          echo "Desktop outputs:"
          find desktop/build/compose/binaries -type f -maxdepth 8 -print 2>/dev/null || true
          test -d desktop/build/compose/binaries
          test -n "$(find desktop/build/compose/binaries -type f -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-desktop
          path: desktop/build/compose/binaries
          if-no-files-found: error
