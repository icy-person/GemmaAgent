name: AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file patchelf desktop-file-utils libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Build GemmaAgent UI and CPU trainer
        run: |
          set -euo pipefail
          cargo build --release --bin gemma-ui --features runner-cpu
          cargo build --release --bin cpu-train --features runner-cpu

      - name: Build AMD trainer
        run: |
          set -euo pipefail
          cargo build --release --no-default-features --features amd-vulkan --bin amd-train

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps dist

          cp target/release/gemma-ui AppDir/usr/bin/gemma-ui
          cp target/release/cpu-train AppDir/usr/bin/cpu-train
          cp target/release/amd-train AppDir/usr/bin/amd-train
          chmod +x AppDir/usr/bin/gemma-ui AppDir/usr/bin/cpu-train AppDir/usr/bin/amd-train

      - name: Verify trainer binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in gemma-ui cpu-train amd-train; do
            test -f "AppDir/usr/bin/$binary"
            test -x "AppDir/usr/bin/$binary"
            file "AppDir/usr/bin/$binary"
          done

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          if [ -f packaging/appimagetool-x86_64.AppImage ]; then
            chmod +x packaging/appimagetool-x86_64.AppImage
            packaging/appimagetool-x86_64.AppImage AppDir dist/GemmaAgent-x86_64.AppImage
          elif command -v appimagetool >/dev/null 2>&1; then
            appimagetool AppDir dist/GemmaAgent-x86_64.AppImage
          else
            echo "appimagetool not found"
            exit 1
          fi

      - name: Verify packaged AppImage
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/GemmaAgent-x86_64.AppImage
          chmod +x dist/GemmaAgent-x86_64.AppImage
          test -f AppDir/usr/bin/gemma-ui
          test -f AppDir/usr/bin/cpu-train
          test -f AppDir/usr/bin/amd-train

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-AppImage-x86_64
          path: dist/GemmaAgent-x86_64.AppImage
