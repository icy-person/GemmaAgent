name: AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Disable broken Google Chrome apt source
        run: |
          sudo grep -RIl 'dl.google.com/linux/chrome-stable/deb' /etc/apt/sources.list.d 2>/dev/null \
            | xargs -r sudo rm -f

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file patchelf desktop-file-utils libfuse2

      - name: Build GemmaAgent UI and trainers
        run: |
          set -euo pipefail
          cargo build --release --bin gemma-ui
          cargo build --release --bin cpu-train
          cargo build --release --bin amd-train --features amd-vulkan

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps dist

          # The UI discovers trainers beside its own executable. Keeping all
          # three binaries in the same AppDir/usr/bin makes that work both
          # inside the AppImage and after extraction.
          cp target/release/gemma-ui AppDir/usr/bin/gemma-ui
          cp target/release/cpu-train AppDir/usr/bin/cpu-train
          cp target/release/amd-train AppDir/usr/bin/amd-train
          chmod +x AppDir/usr/bin/gemma-ui AppDir/usr/bin/cpu-train AppDir/usr/bin/amd-train

          cp packaging/gemma-agent.desktop AppDir/usr/share/applications/gemma-agent.desktop
          cp packaging/gemma-agent.svg AppDir/usr/share/icons/hicolor/scalable/apps/gemma-agent.svg
          cp packaging/gemma-agent.desktop AppDir/gemma-agent.desktop
          cp packaging/gemma-agent.svg AppDir/gemma-agent.svg

      - name: Install linuxdeploy
        run: |
          curl -L --fail --retry 3 -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage

      - name: Build AppImage
        env:
          ARCH: x86_64
        run: |
          set -euo pipefail
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/gemma-agent.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/gemma-agent.svg \
            --output appimage
          mv GemmaAgent*.AppImage dist/GemmaAgent-x86_64.AppImage
          chmod +x dist/GemmaAgent-x86_64.AppImage
          file dist/GemmaAgent-x86_64.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-AppImage-x86_64
          path: dist/GemmaAgent-x86_64.AppImage
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GemmaAgent-x86_64.AppImage
          generate_release_notes: true
