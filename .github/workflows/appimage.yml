name: AppImage

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file patchelf desktop-file-utils libfuse2 python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install appimagetool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          sudo mv appimagetool.AppImage /usr/local/bin/appimagetool
          appimagetool --version || true

      - name: Validate dataset preparation scripts
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_curriculum.py scripts/prepare_online_corpus.py scripts/prepare_real_corpus.py

      - name: Build GemmaAgent UI and CPU trainer
        run: |
          set -euo pipefail
          cargo build --release --bin gemma-ui --features runner-cpu
          cargo build --release --bin cpu-train --features runner-cpu

      - name: Build AMD trainer
        run: |
          set -euo pipefail
          cargo build --release --no-default-features --features amd-vulkan --bin amd-train

      - name: Prepare AppDir
        shell: bash
        run: |
          set -euo pipefail
          rm -rf AppDir dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps AppDir/usr/share/gemma-agent/scripts dist

          cp target/release/gemma-ui AppDir/usr/bin/gemma-ui
          cp target/release/cpu-train AppDir/usr/bin/cpu-train
          cp target/release/amd-train AppDir/usr/bin/amd-train
          chmod +x AppDir/usr/bin/gemma-ui AppDir/usr/bin/cpu-train AppDir/usr/bin/amd-train

          cp AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          cp scripts/prepare_curriculum.py AppDir/usr/share/gemma-agent/scripts/prepare_curriculum.py
          cp scripts/prepare_online_corpus.py AppDir/usr/share/gemma-agent/scripts/prepare_online_corpus.py
          cp scripts/prepare_real_corpus.py AppDir/usr/share/gemma-agent/scripts/prepare_real_corpus.py

          cp packaging/gemma-agent.desktop AppDir/usr/share/applications/gemma-agent.desktop
          cp packaging/gemma-agent.svg AppDir/usr/share/icons/hicolor/scalable/apps/gemma-agent.svg
          cp packaging/gemma-agent.desktop AppDir/gemma-agent.desktop
          cp packaging/gemma-agent.svg AppDir/gemma-agent.svg

      - name: Verify AppDir
        shell: bash
        run: |
          set -euo pipefail
          test -f AppDir/AppRun
          test -x AppDir/AppRun
          test -f AppDir/gemma-agent.desktop
          test -f AppDir/gemma-agent.svg
          for binary in gemma-ui cpu-train amd-train; do
            test -f "AppDir/usr/bin/$binary"
            test -x "AppDir/usr/bin/$binary"
            file "AppDir/usr/bin/$binary"
          done
          for script in prepare_curriculum.py prepare_online_corpus.py prepare_real_corpus.py; do
            test -f "AppDir/usr/share/gemma-agent/scripts/$script"
          done
          python3 -m py_compile AppDir/usr/share/gemma-agent/scripts/*.py

      - name: Package AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimagetool AppDir dist/GemmaAgent-x86_64.AppImage

      - name: Verify packaged AppImage
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/GemmaAgent-x86_64.AppImage
          test -x dist/GemmaAgent-x86_64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-AppImage-x86_64
          path: dist/GemmaAgent-x86_64.AppImage
