name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Keep CUDA out of the generic runner: candle/cudarc requires nvcc.
      # Existing educational entrypoints intentionally expose a few unused
      # helpers and a long argument list; don't turn those into CI failures.
      - run: cargo clippy --all-targets -- -D warnings -A dead_code -A clippy::too-many-arguments -A clippy::unusual-byte-groupings
      - run: cargo test --all-targets
      - run: cargo build --release --bin cpu-train
      # Compile-check the full AMD/Vulkan path separately.
      - run: cargo check --all-targets --features amd-vulkan
