name: Build GemmaAgent Arch

on:
  workflow_dispatch:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel jdk21-openjdk git unzip zip which curl wget chromium
      - name: Install Gradle
        run: |
          mkdir -p /opt/gradle
          curl -fsSL https://services.gradle.org/distributions/gradle-9.7.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          /opt/gradle/gradle-9.7.1/bin/gradle :shared:jvmTest :desktop:createDistributable --no-daemon --stacktrace
          test -d desktop/build/compose/binaries/main/app/GemmaAgent
      - name: Package
        run: |
          mkdir -p dist
          tar -C desktop/build/compose/binaries/main/app -czf dist/GemmaAgent-Arch-x86_64.tar.gz GemmaAgent
      - uses: actions/upload-artifact@v4
        with:
          name: GemmaAgent-Arch-x86_64
          path: dist/GemmaAgent-Arch-x86_64.tar.gz
          if-no-files-found: error
