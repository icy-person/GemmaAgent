name: Train GemmaAgent CPU

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label"
        required: true
        default: "ubuntu-latest"
        type: string
      stage_steps:
        description: "Optimizer steps per curriculum stage"
        required: true
        default: "200"
        type: string
      runtime_minutes:
        description: "Train continuously for this many minutes"
        required: true
        default: "330"
        type: string
      grad_accum:
        description: "Gradient accumulation steps"
        required: true
        default: "8"
        type: string
      targets_per_step:
        description: "Token positions sampled from each context"
        required: true
        default: "32"
        type: string

  schedule:
    - cron: "0 0,6,12,18 * * *"

concurrency:
  group: gemmaagent-cpu-training
  cancel-in-progress: false

jobs:
  train:
    name: Continuous CPU curriculum training
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        shell: bash
        run: |
          set -euxo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends python3 ca-certificates curl jq
          fi

      - name: Restore latest checkpoint artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p checkpoints
          previous_run="$(gh run list --workflow train.yml --limit 20 --json databaseId --jq ".[] | select(.databaseId != ${GITHUB_RUN_ID}) | .databaseId" | head -n 1 || true)"
          if [[ -n "$previous_run" ]]; then
            echo "Trying previous training run: $previous_run"
            if gh run download "$previous_run" --name gemmaagent-cpu-checkpoint --dir checkpoints; then
              find checkpoints -maxdepth 2 -type f -print
            else
              echo "No downloadable previous checkpoint; starting fresh."
            fi
          fi

      - name: Prepare public corpus and curriculum
        shell: bash
        run: |
          set -euxo pipefail
          python3 scripts/prepare_real_corpus.py
          python3 scripts/prepare_curriculum.py
          test -s data/train.txt
          test -s data/val.txt
          test -s data/curriculum/01-literature.txt
          test -s data/curriculum/02-code.txt
          test -s data/curriculum/03-math.txt
          test -s data/curriculum/04-reasoning.txt
          test -s data/curriculum/05-balanced.txt

      - name: Build optimized CPU trainer
        run: cargo build --release --bin cpu-train

      - name: Continuous curriculum training
        env:
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set -u
          mkdir -p checkpoints run-report
          STAGE_STEPS="${{ inputs.stage_steps || '200' }}"
          RUNTIME_MINUTES="${{ inputs.runtime_minutes || '330' }}"
          GRAD_ACCUM="${{ inputs.grad_accum || '8' }}"
          TARGETS_PER_STEP="${{ inputs.targets_per_step || '32' }}"
          DEADLINE=$(( $(date +%s) + RUNTIME_MINUTES * 60 ))
          CHECKPOINT="checkpoints/gemma-agent.cpu.ckpt"
          LOG="run-report/training.log"
          stage=0
          while (( $(date +%s) < DEADLINE )); do
            stage=$((stage + 1))
            case $((stage % 5)) in
              1) DOMAIN="01-literature"; LR="0.00020" ;;
              2) DOMAIN="02-code";       LR="0.00012" ;;
              3) DOMAIN="03-math";       LR="0.00015" ;;
              4) DOMAIN="04-reasoning";  LR="0.00010" ;;
              0) DOMAIN="05-balanced";   LR="0.00008" ;;
            esac
            DATA="data/curriculum/${DOMAIN}.txt"
            echo "===== curriculum stage ${stage}: ${DOMAIN}, lr=${LR} =====" | tee -a "$LOG"

            if [[ -s "$CHECKPOINT" ]]; then
              set +e
              ./target/release/cpu-train \
                --target \
                --steps "$STAGE_STEPS" \
                --data "$DATA" \
                --checkpoint "$CHECKPOINT" \
                --resume "$CHECKPOINT" \
                --grad-accum "$GRAD_ACCUM" \
                --targets-per-step "$TARGETS_PER_STEP" \
                --lr "$LR" \
                --checkpoint-every 100 \
                2>&1 | tee -a "$LOG"
              rc=${PIPESTATUS[0]}
              set -e
              if [[ "$rc" -ne 0 ]]; then
                echo "Resume failed; discarding incompatible checkpoint and restarting this stage." | tee -a "$LOG"
                rm -f "$CHECKPOINT"
              else
                continue
              fi
            fi

            ./target/release/cpu-train \
              --target \
              --steps "$STAGE_STEPS" \
              --data "$DATA" \
              --checkpoint "$CHECKPOINT" \
              --grad-accum "$GRAD_ACCUM" \
              --targets-per-step "$TARGETS_PER_STEP" \
              --lr "$LR" \
              --checkpoint-every 100 \
              2>&1 | tee -a "$LOG"
          done

          cat > run-report/run-info.txt <<EOF
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          runner=${RUNNER_NAME}
          runtime_minutes=${RUNTIME_MINUTES}
          stage_steps=${STAGE_STEPS}
          grad_accum=${GRAD_ACCUM}
          targets_per_step=${TARGETS_PER_STEP}
          curriculum=01-literature,02-code,03-math,04-reasoning,05-balanced
          EOF

      - name: Upload checkpoint and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemmaagent-cpu-checkpoint
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
          path: |
            checkpoints/gemma-agent.cpu.ckpt
            run-report/
            data/corpus_manifest.json
