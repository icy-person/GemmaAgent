name: Train GemmaAgent CPU

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_minutes:
        description: "Maximum wall-clock training time"
        required: true
        default: "330"
        type: string
      stage_steps:
        description: "Optimizer updates per curriculum stage"
        required: true
        default: "100"
        type: string
      grad_accum:
        description: "CPU gradient accumulation"
        required: true
        default: "8"
        type: string
      targets_per_step:
        description: "Random token positions sampled from each context"
        required: true
        default: "128"
        type: string
      eval_samples:
        description: "Held-out validation windows after each stage"
        required: true
        default: "16"
        type: string
      online_pages:
        description: "Maximum cached Wikimedia pages for the online stage"
        required: true
        default: "160"
        type: string
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: gemmaagent-cpu-training
  cancel-in-progress: false

jobs:
  train:
    name: Continuous CPU curriculum training
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python and helper tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Restore latest checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoints
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="gemmaagent-cpu-checkpoint" and .expired==false) | [.id,.created_at] | @tsv' | sort -k2 -r | head -n1)"
          if [[ -n "$artifact_json" ]]; then
            artifact_id="${artifact_json%%$'\t'*}"
            echo "restoring artifact $artifact_id"
            gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/checkpoint.zip
            unzip -o /tmp/checkpoint.zip -d .
          fi

      - name: Prepare public corpus and curriculum
        run: |
          python3 scripts/prepare_real_corpus.py
          python3 scripts/prepare_curriculum.py

      - name: Refresh controlled online corpus
        env:
          ONLINE_PAGES: ${{ inputs.online_pages || '160' }}
        run: |
          python3 scripts/prepare_online_corpus.py \
            --max-pages "$ONLINE_PAGES" \
            --pages-per-topic 10 \
            --min-chars 300 \
            --delay 0.35

      - name: Build optimized CPU trainer
        run: cargo build --release --no-default-features --features runner-cpu --bin cpu-train

      - name: Continuous curriculum training
        env:
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set -u
          mkdir -p checkpoints run-report
          STAGE_STEPS="${{ inputs.stage_steps || '100' }}"
          RUNTIME_MINUTES="${{ inputs.runtime_minutes || '330' }}"
          GRAD_ACCUM="${{ inputs.grad_accum || '8' }}"
          TARGETS_PER_STEP="${{ inputs.targets_per_step || '128' }}"
          EVAL_SAMPLES="${{ inputs.eval_samples || '16' }}"
          ONLINE_PAGES="${{ inputs.online_pages || '160' }}"
          DEADLINE=$(( $(date +%s) + RUNTIME_MINUTES * 60 ))
          CHECKPOINT="checkpoints/gemma-agent.cpu.ckpt"
          TOKENIZER="checkpoints/gemma-agent.cpu.ckpt.tok"
          LOG="run-report/training.log"
          stage=0
          goal_reached=0

          while (( $(date +%s) < DEADLINE )); do
            stage=$((stage + 1))
            case $((stage % 6)) in
              1) DOMAIN="01-literature"; DATA="data/curriculum/${DOMAIN}.txt"; VAL="data/val.txt"; LR="0.00020" ;;
              2) DOMAIN="02-code";       DATA="data/curriculum/${DOMAIN}.txt"; VAL="data/val.txt"; LR="0.00012" ;;
              3) DOMAIN="03-math";       DATA="data/curriculum/${DOMAIN}.txt"; VAL="data/val.txt"; LR="0.00015" ;;
              4) DOMAIN="04-reasoning";  DATA="data/curriculum/${DOMAIN}.txt"; VAL="data/val.txt"; LR="0.00010" ;;
              5) DOMAIN="05-balanced";   DATA="data/curriculum/${DOMAIN}.txt"; VAL="data/val.txt"; LR="0.00008" ;;
              0) DOMAIN="06-online-wikipedia"; DATA="data/online/train.txt"; VAL="data/online/val.txt"; LR="0.00006" ;;
            esac
            echo "===== curriculum stage ${stage}: ${DOMAIN}, profile=large, lr=${LR} =====" | tee -a "$LOG"

            if [[ ! -s "$DATA" || ! -s "$VAL" ]]; then
              echo "Training data unavailable: data=$DATA val=$VAL" | tee -a "$LOG"
              exit 2
            fi

            CMD=(./target/release/cpu-train --large
              --steps "$STAGE_STEPS"
              --data "$DATA"
              --val-data "$VAL"
              --checkpoint "$CHECKPOINT"
              --tokenizer "$TOKENIZER"
              --train-context 512
              --grad-accum "$GRAD_ACCUM"
              --targets-per-step "$TARGETS_PER_STEP"
              --eval-samples "$EVAL_SAMPLES"
              --lr "$LR"
              --checkpoint-every 25)

            if [[ -s "$CHECKPOINT" ]]; then CMD+=(--resume "$CHECKPOINT"); fi

            set +e
            "${CMD[@]}" 2>&1 | tee -a "$LOG"
            rc=${PIPESTATUS[0]}
            set -e

            if [[ "$rc" -ne 0 ]]; then
              echo "Training stage failed with exit code $rc" | tee -a "$LOG"
              exit "$rc"
            fi

            last_val="$(grep 'validation_loss=' "$LOG" | tail -n 1 | sed -n 's/.*validation_loss=\([0-9.]*\).*/\1/p')"
            if [[ -n "$last_val" ]]; then
              echo "latest_validation_loss=$last_val" | tee -a "$LOG"
              if awk "BEGIN { exit !($last_val < 1.0) }"; then
                echo "GOAL_REACHED: validation loss < 1.0" | tee -a "$LOG"
                goal_reached=1
                break
              fi
            fi
          done

          cat > run-report/run-info.txt <<EOF
          commit=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          runner=${RUNNER_NAME}
          profile=large-49,807,360-parameters
          runtime_minutes=${RUNTIME_MINUTES}
          stage_steps=${STAGE_STEPS}
          grad_accum=${GRAD_ACCUM}
          targets_per_step=${TARGETS_PER_STEP}
          eval_samples=${EVAL_SAMPLES}
          train_context=512
          curriculum=01-literature,02-code,03-math,04-reasoning,05-balanced,06-online-wikipedia
          online_pages=${ONLINE_PAGES}
          online_manifest=data/online_manifest.json
          goal=validation_loss_below_1.0
          goal_reached=${goal_reached}
          EOF

      - name: Upload checkpoint and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemmaagent-cpu-checkpoint
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
          path: |
            checkpoints/gemma-agent.cpu.ckpt
            checkpoints/gemma-agent.cpu.ckpt.opt
            checkpoints/gemma-agent.cpu.ckpt.state
            checkpoints/gemma-agent.cpu.ckpt.tok
            run-report/
            data/corpus_manifest.json
            data/online_manifest.json
